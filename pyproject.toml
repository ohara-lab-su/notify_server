[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notify"
version = "0.1.0"
description = "Lightweight REST notification client/server for calculation scripts"
readme = "README.ja.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.20",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.100",
    "pydantic>=2.0",
    "uvicorn>=0.20",
]
windows-outlook = [
    "pywin32>=300; platform_system == 'Windows'",
]

[project.scripts]
notify-server = "notify.server:main"

[tool.setuptools.packages.find]
include = ["notify*"]
